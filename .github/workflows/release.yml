name: Release

# Déclenché sur chaque tag vX.Y.Z (ex: git tag v1.0.0 && git push --tags)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # créer la GitHub Release et uploader les assets
  packages: write   # pusher les images Docker sur GHCR

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet nécessaire pour le changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Docker buildx est nécessaire pour les builds multi-arch
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Optionnel : activé uniquement si le secret est défini ──────────
          # Homebrew tap  → repo github.com/lucasvavon/homebrew-tap ✓
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Scoop bucket  → créer github.com/<vous>/scoop-bucket en premier
          SCOOP_TOKEN: ${{ secrets.SCOOP_TOKEN }}
